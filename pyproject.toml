[project]
name = "db-hammer"
version = "0.1.0"
description = "db-hammer database toolkit with MCP server"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = [
    "fastmcp>=0.1.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0.0",
    "Flask>=2.3.0",
    "requests>=2.31.0",
]

[project.scripts]
db_hammer_mcp = "db_hammer.cli.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
