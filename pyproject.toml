[project]
name = "db-hammer"
version = "0.1.0"
description = "Database automation toolkit with MCP server"
requires-python = ">=3.10"
dependencies = [
    "Flask>=2.3.0",
    "PyYAML>=6.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
mcp = [
    "fastmcp>=0.1.0",
    "cryptography>=3.4.0",
    "python-jose[cryptography]>=3.3.0",
    "PyYAML>=6.0.0",
]

[project.scripts]
db_hammer_mcp = "cli.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
